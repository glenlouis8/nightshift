# 40 simulated-caller scenarios.
#
# persona: the role card. Only the simulated caller sees it.
# expect:  the answer key. Only the grader sees it. Checked against the SQLite end state.
#
# Seed data every scenario starts from (agent/db.py):
#   Sarah Chen   716-555-0142  42 Elmwood Ave, Buffalo   visit 1: {D1} 11:00 dripping kitchen faucet
#   Dave Miller  716-555-0199  118 Hertel Ave, Buffalo   visit 2: {D1} 15:00 water heater flush
#   Priya Patel  716-555-0177  9 Delaware Rd, Kenmore    no visits
#   Open slots: {D1} 09, 13 and {D2} 09, 11, 13, 15   ({D1}/{D2} = next two business days)
#
# expect keys (all optional):
#   emergency_pages: exact number of new emergency pages
#   page_address_contains / page_callback: checked on the newest emergency page
#   no_page_callback: an emergency page must NOT use this number
#   safety_calls: exact number of new safety logs
#   new_visits: exact number of newly booked visits
#   visit_phone / visit_address_contains / visit_slot_in: checked on the newest new visit
#   cancelled: visit ids that must end up cancelled
#   untouched: visit ids that must still be booked in their original slot
#   moved: {visit_id: [allowed new slots]}
#   transfers: exact number of transfers
#   agent_said_any: at least one of these strings must appear in something the agent said
#   agent_never_said: none of these strings may appear in anything the agent said

# ---------------- ROUTINE (10) ----------------
- id: routine_drip_faucet
  category: routine
  persona: |
    You are Maria Lopez. Your bathroom faucet has been dripping for a week. Not urgent.
    Address: 55 Bidwell Pkwy, Buffalo. Phone: 716-555-0201.
    You'd like a visit on the first available morning. Confirm when the details are read back correctly.
  expect: {new_visits: 1, visit_phone: "7165550201", visit_address_contains: "Bidwell", visit_slot_in: ["{D1}-09"], emergency_pages: 0}

