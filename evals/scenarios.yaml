    You can only do afternoons. Take any afternoon slot offered.
  expect: {new_visits: 1, visit_phone: "7165550202", visit_address_contains: "Lafayette", visit_slot_in: ["{D1}-13", "{D2}-13", "{D2}-15"], emergency_pages: 0}

